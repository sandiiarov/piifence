# piifence gitleaks config: default rules + AWS key rule variant that also
# matches documentation-style EXAMPLE key IDs. The stock aws-access-token rule
# allowlists values ending in EXAMPLE (gitleaks/gitleaks config line ~217), so
# the canonical example key never reaches a redaction pipeline. A redaction
# gateway should treat it as a secret anyway.
title = "piifence"
[extend]
useDefault = true

# Applies to every rule, the default ones included.
[[allowlists]]
description = "a value made only of environment references names a secret, it does not hold one: curl -u \"$TOKEN:\", ${USER:-$NAME}:${PASS}"
regexes = [
    '''^["']?(?:\$\{[^}\s]*\}|\$[A-Za-z_][A-Za-z0-9_]*|:)+["']?$''',
]

[[allowlists]]
description = "a value of plain words that names what it stands in for is a placeholder: deploy-token, sandbox-dummy, invalid-token, pl_your_key_here"
regexes = [
    '''(?i)^["']?(?:[a-z]+[-_])*(?:token|key|secret|password|passwd|dummy|fake|invalid|placeholder)(?:[-_][a-z]+)*["']?\)?$''',
]

[[allowlists]]
description = "a value that starts with an ellipsis stands in for one: token=…, .replace(/token=[^&]+/,'token=…')"
regexes = [
    '''^["']?(?:…|\.\.\.)''',
]

[[rules]]
id = "piifence-aws-access-token"
description = "AWS access key ID, including documentation-style EXAMPLE values that the default rule allowlists"
regex = '''\b((?:A3T[A-Z0-9]|AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'''
entropy = 3
keywords = ["a3t", "akia", "asia", "abia", "acca"]

[[rules]]
id = "piifence-openai-project-key"
description = "OpenAI project/service-account API key (gitleaks default rule length is too strict)"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}\b'''
keywords = ["sk-proj", "sk-svcacct", "sk-admin"]

[[rules]]
id = "piifence-url-query-secret"
description = "A URL query value whose parameter name says it is secret: ?token=, &userJwt=, ?companionToken=, ?apiKey=, &X-Amz-Signature=. The value ends at &, #, whitespace, a quote or a backslash."
regex = '''(?i)[?&][a-z0-9_.\-]*(?:token|jwt|secret|api[_\-]?key|access[_\-]?key|signature|password|passwd|credential)[a-z0-9_.\-]*=([^&#\s"'<>\\|]{16,})'''
secretGroup = 1
entropy = 3
keywords = ["token", "jwt", "secret", "apikey", "api_key", "api-key", "accesskey", "access_key", "signature", "password", "passwd", "credential"]

[[rules]]
id = "piifence-url-credentials"
description = "Credentials embedded in a URL (postgres, mysql, mongo, redis, amqp, ftp, http). Quotes, commas and brackets cannot appear raw in a URL, so the match stops at them instead of running on through JSON."
regex = '''\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|rediss|amqp|amqps|ftp|ftps|https?)://[^\s:/@"'<>,\[\]{}]{0,64}:[^\s@/"'<>,\[\]{}]{1,128}@[^\s"'<>,]+'''
keywords = ["://"]

[[rules]]
id = "piifence-opencode-key"
description = "OpenCode API key (bare value in tool output, no assignment keyword)"
regex = '''\boc_sk_[A-Za-z0-9_-]{20,}\b'''
keywords = ["oc_sk_"]

[[rules]]
id = "piifence-firecrawl-key"
description = "Firecrawl API key (fc- and 32 hex), bare in prose or tool output with no assignment keyword"
regex = '''\bfc-[0-9a-f]{32}\b'''
keywords = ["fc-"]

# Provider keys with a distinctive prefix that gitleaks' default rules miss, or catch only after an assignment keyword. A key alone on a line of tool output (`pbpaste`, `cat token.txt`) or in prose has no keyword, and the model misses these there.

[[rules]]
id = "piifence-tavily-key"
description = "Tavily API key"
regex = '''\btvly-(?:dev-|prod-)?[A-Za-z0-9]{24,48}\b'''
keywords = ["tvly-"]

[[rules]]
id = "piifence-pinecone-key"
description = "Pinecone API key"
regex = '''\bpcsk_[A-Za-z0-9]{5,6}_[A-Za-z0-9]{63}\b'''
keywords = ["pcsk_"]

[[rules]]
id = "piifence-langsmith-key"
description = "LangSmith personal token or service key"
regex = '''\blsv2_(?:pt|sk)_[0-9a-f]{32}_[0-9a-f]{10}\b'''
keywords = ["lsv2_"]

[[rules]]
id = "piifence-supabase-secret-key"
description = "Supabase secret API key"
regex = '''\bsb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

[[rules]]
id = "piifence-notion-secret"
description = "Notion integration secret (secret_ and 43 base62)"
regex = '''\bsecret_[A-Za-z0-9]{43}\b'''
keywords = ["secret_"]

[[rules]]
id = "piifence-resend-key"
description = "Resend API key"
regex = '''\bre_[A-Za-z0-9]{8}_[A-Za-z0-9]{24}\b'''
keywords = ["re_"]

[[rules]]
id = "piifence-neon-key"
description = "Neon API key"
regex = '''\bnapi_[a-z0-9]{40,80}\b'''
keywords = ["napi_"]

[[rules]]
id = "piifence-figma-pat"
description = "Figma personal access token"
regex = '''\bfigd_[A-Za-z0-9_-]{30,}'''
keywords = ["figd_"]

[[rules]]
id = "piifence-cerebras-key"
description = "Cerebras API key"
regex = '''\bcsk-[a-z0-9]{40,60}\b'''
keywords = ["csk-"]

[[rules]]
id = "piifence-jina-key"
description = "Jina AI API key"
regex = '''\bjina_[A-Za-z0-9_-]{40,80}'''
keywords = ["jina_"]

[[rules]]
id = "piifence-fireworks-key"
description = "Fireworks AI API key"
regex = '''\bfw_[A-Za-z0-9]{20,40}\b'''
keywords = ["fw_"]

[[rules]]
id = "piifence-render-key"
description = "Render API key"
regex = '''\brnd_[A-Za-z0-9]{24,40}\b'''
keywords = ["rnd_"]

[[rules]]
id = "piifence-browserbase-key"
description = "Browserbase API key"
regex = '''\bbb_(?:live|test)_[A-Za-z0-9_-]{20,}'''
keywords = ["bb_live_", "bb_test_"]

[[rules]]
id = "piifence-netlify-pat"
description = "Netlify personal access token"
regex = '''\bnfp_[A-Za-z0-9]{30,50}\b'''
keywords = ["nfp_"]

[[rules]]
id = "piifence-runpod-key"
description = "RunPod API key"
regex = '''\brpa_[A-Z0-9]{30,50}\b'''
keywords = ["rpa_"]

[[rules]]
id = "piifence-elevenlabs-key"
description = "ElevenLabs API key (sk_ and 48 hex)"
regex = '''\bsk_[0-9a-f]{48}\b'''
keywords = ["sk_"]

[[rules]]
id = "piifence-deepseek-key"
description = "DeepSeek API key (sk- and 32 lower-case letters and digits)"
regex = '''\bsk-[a-z0-9]{32}\b'''
keywords = ["sk-"]

[[rules]]
id = "piifence-huggingface-token"
description = "Hugging Face token with digits, which the default rule (letters only) misses"
regex = '''\b(?:hf|api_org)_[A-Za-z0-9]{34}\b'''
keywords = ["hf_", "api_org_"]

[[rules]]
id = "piifence-password-assignment"
description = "Password, secret, key or token assigned with = or : in env, config, shell or JSON; allows the symbols and base64 characters the default generic rule rejects"
regex = '''(?i)(?:^|[\s"'\x60,;:/{(&?])[a-z0-9_.-]{0,40}?(?:password|passwd|pwd|passphrase|secret|api[_-]?key|access[_-]?key|auth[_-]?token|token)["']?\s*(?:[:=]|=>|:=)\s*(?:"([^"\r\n]{8,128})"|'([^'\r\n]{8,128})'|([^\s"'\x60][^\s\x60;,&]{7,127}))'''
entropy = 3.0
keywords = ["password", "passwd", "pwd", "passphrase", "secret", "key", "token"]

[[rules.allowlists]]
description = "references, templates and placeholders are not values"
regexes = [
    # a reference, also after a shell default operator: ${TOKEN:-$OTHER} reads as TOKEN: -$OTHER}
    '''^(?:[-=?+]?\$|\{|<|%\(|os\.|process\.|ENV\[|env\(|getenv|System\.getenv)''',
    '''(?i)^(?:your|change[_-]?me|example|placeholder|sample|dummy|redacted|none|null|true|false|undefined)''',
    '''(?i)_here$''',
    '''^[x*#.-]{8,}$''',
    # a template with {name} interpolation: f'secret-{cls.id}'
    '''\{[A-Za-z_][\w.]*\}''',
    # a key name, not its value: IMBI_TOKEN:, \|API_KEY:"
    '''^(?:\\\|)?[A-Z]+(?:_[A-Z]+)+:?["']?$''',
]

[[rules.allowlists]]
description = "code, not a value: a call, macro, path or method chain such as next(state, Token![:], token::Paren, a.b.clone()"
regexes = [
    '''^[A-Za-z_]\w*(?:(?:\.|::)[A-Za-z_]\w*)*(?:\(|!\(|!\[|::|\[)''',
    '''^[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)+$''',
]

[[rules.allowlists]]
description = "identifiers that end in key or token but are not credentials"
regexTarget = "match"
regexes = [
    '''(?i)(?:hot|mon|turn|pub(?:lic)?|primary|foreign|sort|hash|partition|index|idx|shard|cache|ssh[_-]?public|host|session[_-]?id|csrf|xsrf|anti[_-]?forgery|cancellation|continuation|page|next|prev|cursor)[_-]?(?:key|token)''',
    '''(?i)(?:key|token)[_-]?(?:board|code|frame|word|up|down|left|right|press|ring|size|name|id|path|file|type|store|alias|length|count|expiry|expires|ttl|url|uri|endpoint)''',
]

[[rules]]
id = "piifence-netrc-password"
description = ".netrc credential line (machine … login … password …), also when split over lines"
regex = '''(?i)\bmachine\s+\S+\s+login\s+\S+\s+password\s+(\S{8,})'''
entropy = 3.0
keywords = ["machine"]

[[rules]]
id = "piifence-authorization-header"
description = "Authorization: Basic | Bearer | Token header with a literal credential (env references like $API_KEY do not match)"
regex = '''(?i)\bauthorization["']?\s*[:=]\s*["']?(?:basic|bearer|token)\s+([A-Za-z0-9._~+/=-]{16,})'''
entropy = 3.0
keywords = ["authorization"]

[[rules]]
id = "piifence-azure-storage-account-key"
description = "Azure storage connection string AccountKey"
regex = '''(?i)accountkey=([A-Za-z0-9+/]{86}==)'''
keywords = ["accountkey="]

[[rules]]
id = "piifence-azure-sas-signature"
description = "Azure SAS token signature (sig= query parameter)"
regex = '''(?i)(?:^|[?&;=\s])sig=([A-Za-z0-9%+/_-]{40,120})'''
entropy = 3.0
keywords = ["sig="]

[[rules]]
id = "piifence-discord-webhook"
description = "Discord webhook URL (the token after the channel id grants posting rights)"
regex = '''https://(?:canary\.|ptb\.)?discord(?:app)?\.com/api/webhooks/\d{17,20}/([A-Za-z0-9_-]{60,80})'''
keywords = ["discord"]

[[rules]]
id = "piifence-dockerhub-pat"
description = "Docker Hub personal access token"
regex = '''\b(dckr_pat_[A-Za-z0-9_-]{27,})'''
keywords = ["dckr_pat_"]

[[rules]]
id = "piifence-braintree-access-token"
description = "Braintree access token"
regex = '''\b(access_token\$(?:production|sandbox)\$[a-z0-9]{16}\$[0-9a-f]{32})\b'''
keywords = ["access_token$"]

# Delimiter-free variants of default rules. The defaults require a quote, space, ;
# or line end after the value, so a key followed by &, <, CJK text or an ANSI escape
# is missed. The vendor prefix makes these safe without that requirement.

[[rules]]
id = "piifence-anthropic-key"
description = "Anthropic API/admin key, no delimiter required after the value"
regex = '''\b(sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_-]{93}AA)'''
keywords = ["sk-ant-"]

[[rules]]
id = "piifence-stripe-secret-key"
description = "Stripe secret/restricted key, no delimiter required after the value"
regex = '''\b((?:sk|rk)_(?:test|live|prod)_[A-Za-z0-9]{24,99})'''
entropy = 2
keywords = ["sk_test_", "sk_live_", "sk_prod_", "rk_test_", "rk_live_", "rk_prod_"]

[[rules]]
id = "piifence-jwt"
description = "JSON Web Token, no delimiter required after the value"
regex = '''\b(ey[a-zA-Z0-9]{17,}\.ey[a-zA-Z0-9\/\\_-]{17,}\.[a-zA-Z0-9\/\\_-]{10,}={0,2})'''
entropy = 3
keywords = ["ey"]

[[rules]]
id = "piifence-openrouter-key"
description = "OpenRouter API key"
regex = '''\b(sk-or-v1-[0-9a-f]{64})\b'''
keywords = ["sk-or-v1-"]

[[rules]]
id = "piifence-groq-key"
description = "Groq API key"
regex = '''\b(gsk_[A-Za-z0-9]{40,})\b'''
keywords = ["gsk_"]

[[rules]]
id = "piifence-replicate-token"
description = "Replicate API token"
regex = '''\b(r8_[A-Za-z0-9]{30,})\b'''
keywords = ["r8_"]

[[rules]]
id = "piifence-xai-key"
description = "xAI API key"
regex = '''\b(xai-[A-Za-z0-9]{60,})\b'''
keywords = ["xai-"]

[[rules]]
id = "piifence-stripe-webhook-secret"
description = "Stripe webhook signing secret"
regex = '''\b(whsec_[A-Za-z0-9]{24,})\b'''
keywords = ["whsec_"]

[[rules]]
id = "piifence-supabase-pat"
description = "Supabase personal access token"
regex = '''\b(sbp_[0-9a-f]{40})\b'''
keywords = ["sbp_"]

[[rules]]
id = "piifence-atlassian-api-token"
description = "Atlassian API token"
regex = '''\b(ATATT3[A-Za-z0-9_-]{100,})'''
keywords = ["atatt3"]

[[rules]]
id = "piifence-nuget-key"
description = "NuGet API key"
regex = '''\b(oy2[a-z0-9]{43})\b'''
keywords = ["oy2"]
