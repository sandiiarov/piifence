[package]
name = "piifence"
version = "0.1.0"
edition = "2021"
default-run = "piifence"
description = "Keeps secrets out of what Claude Code sends to the model provider: SporeLabs Scrub (candle, Accelerate) + gitleaks + key rules + guards"
publish = false

[[bin]]
name = "piifence-gateway"
path = "src/bin/gateway.rs"

[[bin]]
name = "piifence"
path = "src/bin/piifence.rs"

[dependencies]
candle-core = { version = "0.11", features = ["accelerate"] }
candle-nn = { version = "0.11", features = ["accelerate"] }
candle-transformers = { version = "0.11", features = ["accelerate"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"
toml = "0.8"
regex = "1"
aho-corasick = "1"
async-recursion = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
